name: Tag publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
  workflow_dispatch:

# Least privilege by default. Each job is granted what it needs.
permissions: {}

# Keyed on the ref, so two different tags never share a group and run
# concurrently. This only binds when the same tag is re-pushed or a run is
# re-run, and there it does not cancel: a half-finished release run can leave a
# tag partly published.
concurrency:
  # The sha is part of the group on main, so every commit gets its own.
  # Without it, back-to-back merges lose CI results: GitHub allows one
  # running and one pending run per group, and cancels the pending one
  # when a third arrives -- whatever cancel-in-progress says, because that
  # setting only protects a run that has already started. Five merges in
  # three minutes cancelled 18 runs across 7 workflows this way, leaving
  # three consecutive commits on main with no test result at all.
  #
  # Pull-request branches keep sharing a group and still cancel, which is
  # what you want there.
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so any workflow merge-gate.yml calls would
  # share a group with its siblings and cancel them. 8 of 9 calls died that way,
  # reported as failures with no jobs and no error message.
  group: Tag publish-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: false

jobs:
  license-checks:
    name: License checks (gate)
    uses: ./.github/workflows/license.yml
    permissions:
      contents: read

  # Builds nvkectl once for the three cli publishers below. vX.Y.Z and
  # vX.Y.Z-beta.N tags ship nvkectl; a vX.Y.Z-rc.N publishes nothing here.
  build-cli:
    name: Build nvkectl
    outputs:
      # The three cli publishers below consume these, so a tag produces one
      # build rather than four.
      dist_artifact: cli-dist-${{ github.run_id }}-${{ github.run_attempt }}
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [license-checks]
    permissions:
      contents: read
      actions: read  # upload-sarif reads the workflow run
      security-events: write  # the malware scan uploads SARIF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only a vX.Y.Z or vX.Y.Z-beta.N tag builds a release, versioned by the bare
      # v* describe. Anything else, such as a dispatch from a branch, fails
      # rather than skips, because silence reads as success.
      - name: Resolve the version from the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::${TAG} is neither a vX.Y.Z nor a vX.Y.Z-beta.N tag."
            exit 1
          fi
          VERSION="$(git describe --tags --always --match 'v*' "${GITHUB_SHA}")"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Building nvkectl ${VERSION} for ${TAG}"

      # go.work, not cli/go.mod, like every other workflow here. setup-go pins
      # GOTOOLCHAIN=local, so the toolchain must satisfy the workspace, which
      # asks for the highest of its members. go.work went to 1.26.6 while
      # cli/go.mod stayed on 1.26.5, and build-cross failed on every release tag.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work

      - name: Build nvkectl
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          make -C cli build-cross DIST="${GITHUB_WORKSPACE}/dist" NVKECTL_VERSION="${{ steps.version.outputs.version }}"
          echo "artifacts:"
          find dist -mindepth 1 -maxdepth 1 -printf '  %f\n' | sort

      # Uploaded so the three cli publishers consume these exact bytes rather
      # than each running build-cross again.
      - name: Upload the built binaries for the publishers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          retention-days: 1

      # build-cross stamps the version from `git describe`, this job takes it
      # from the tag, and nothing tied the two together. The runner is
      # linux/amd64, so the shipped binary can be asked directly.
      - name: Check nvkectl reports the tag version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BIN="${GITHUB_WORKSPACE}/dist/nvkectl-linux-amd64"

          # 2>&1 and the exit check, so a binary that dies on start fails here
          # rather than printing nothing and matching whatever comes last.
          if ! out="$("${BIN}" version 2>&1)"; then
            echo "::error::${BIN} version exited non-zero: ${out}"
            exit 1
          fi

          # The trailing space is load-bearing: it stops a v0.1.0 tag accepting
          # a v0.1.0-rc.1 binary, or a describe with commits after the tag.
          case "${out}" in
            "nvkectl ${VERSION} "*) echo "nvkectl reports ${VERSION}: ${out}" ;;
            *)
              echo "::error::This release is tagged ${VERSION}, and the binary reports: ${out}"
              exit 1
              ;;
          esac

      # Scans what the publishers are about to ship. They need this job, so a
      # finding stops every channel before anything leaves the runner.
      - name: Malware scan the built binaries
        uses: ./.github/actions/malware-scan
        with:
          scan_path: 'dist'
          category: 'clamav-release'
          output_file: 'clamav-release.sarif'

  # The three cli channels. They used to trigger on a release tag themselves,
  # which meant four independent build-cross runs claiming to be one release,
  # and three publish paths that never waited for license-checks. Calling them
  # here fixes both: one build, and everything behind the gate.
  cli-ghcr:
    needs: [build-cli]
    uses: ./.github/workflows/cli-artifact.yml
    permissions:
      contents: read
      packages: write
      actions: read  # upload-sarif reads the workflow run
      security-events: write
    with:
      dist_artifact: ${{ needs.build-cli.outputs.dist_artifact }}

  cli-nvcr:
    needs: [build-cli]
    uses: ./.github/workflows/cli-artifact-nvcr.yml
    permissions:
      contents: read
      actions: read  # upload-sarif reads the workflow run
      security-events: write
    secrets:
      NGC_REGISTRY_TOKEN_NVKE: ${{ secrets.NGC_REGISTRY_TOKEN_NVKE }}
      NGC_REGISTRY_TOKEN_DSX: ${{ secrets.NGC_REGISTRY_TOKEN_DSX }}
    with:
      dist_artifact: ${{ needs.build-cli.outputs.dist_artifact }}

  cli-s3:
    needs: [build-cli]
    uses: ./.github/workflows/cli-s3-publish.yml
    permissions:
      contents: read
      id-token: write
      actions: read  # upload-sarif reads the workflow run
      security-events: write
    with:
      dist_artifact: ${{ needs.build-cli.outputs.dist_artifact }}
